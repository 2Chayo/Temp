---
- hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Who am I
      ansible.builtin.command: whoami
      register: me
      changed_when: false

    - name: Same command as manual
      ansible.builtin.shell: journalctl -u 'ssh*' --since "24 hours ago" --no-pager | grep "Failed password"
      register: r
      failed_when: false
      changed_when: false

    - ansible.builtin.debug:
        msg: "user={{ me.stdout }} rc={{ r.rc }} lines={{ r.stdout_lines | length }} stderr={{ r.stderr }}"
