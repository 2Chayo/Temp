- name: SSH Failed Login Report
  hosts: all
  become: true
  gather_facts: true

  vars:
    ssh_log_period: "24 hours ago"
    ansible_python_interpreter: /usr/bin/python3

  tasks:

    - name: Collect Clean SSH Failed Login Details
      ansible.builtin.shell: |
        set -o pipefail
        journalctl -q \
          --since "{{ ssh_log_period }}" \
          --no-pager \
          -o short-iso 2>&1 \
          | grep -vE "ansible-|sudo:" \
          | awk '/(sshd|sshd-session)\[[0-9]+\]: Failed password for/' \
          | sed 's/^[[:space:]]*//'
      args:
        executable: /bin/bash
      register: ssh_failed_raw
      changed_when: false

    - name: Filter Out Command Artifacts and Count
      ansible.builtin.set_fact:
        # กรองเอาเฉพาะบรรทัดที่มีวันที่และคำว่า Failed password จริง ๆ ตัดบรรทัดคำสั่งหลงเหลือทิ้ง
        clean_logs: "{{ ssh_failed_raw.stdout_lines | select('match', '^[0-9]{4}-[0-9]{2}-[0-9]{2}.*Failed password for') | list }}"

    - name: Set Final Count
      ansible.builtin.set_fact:
        failed_count: "{{ clean_logs | length }}"

    - name: Display Clean Failed Login Details
      ansible.builtin.debug:
        var: clean_logs
      when: failed_count | int > 0
