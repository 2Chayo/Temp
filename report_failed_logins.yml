- name: SSH Failed Login Report
  hosts: all
  become: true
  gather_facts: true

  vars:
    ssh_log_period: "24 hours ago"
    ansible_python_interpreter: /usr/bin/python3

  tasks:

    - name: Collect and Summarize SSH Failed Logins
      ansible.builtin.shell: |
        set -o pipefail
        
        # 1. ดึง Log ที่ไม่ใช่ของ ansible และตรงกับเงื่อนไข Failed password
        LOGS=$(journalctl -q --since "{{ ssh_log_period }}" --no-pager -o short-iso 2>&1 \
               | grep -v "ansible-" \
               | awk '/(sshd|sshd-session)\[[0-9]+\]: Failed password for/')

        # 2. นับจำนวนทั้งหมด
        COUNT=$(echo "$LOGS" | grep -c '.' || echo 0)
        if [ -z "$LOGS" ]; then COUNT=0; fi

        # 3. สรุปจำนวนแยกตาม IP
        if [ "$COUNT" -gt 0 ]; then
          SUMMARY=$(echo "$LOGS" | grep -oE 'from [0-9.]+' | awk '{print $2}' | sort | uniq -c | sort -nr)
        else
          SUMMARY="No failed logins"
        fi

        # ส่งออกผลลัพธ์ในรูปแบบที่อ่านง่าย (ขั้นด้วยเครื่องหมายพิเศษเพื่อให้ Ansible แยกส่วนได้)
        echo "COUNT_RESULT=$COUNT"
        echo "===IP_SUMMARY==="
        echo "$SUMMARY"
        echo "===LOG_DETAILS==="
        echo "$LOGS"
      args:
        executable: /bin/bash
      register: ssh_report_raw
      changed_when: false

    - name: Parse Shell Output into Facts
      ansible.builtin.set_fact:
        failed_count: "{{ ssh_report_raw.stdout | regex_search('COUNT_RESULT=(.*)', '\\1') | first | trim }}"
        ip_summary_lines: "{{ (ssh_report_raw.stdout | regex_search('===IP_SUMMARY===\\n([\\s\\S]*?)\\n===LOG_DETAILS===', '\\1')).split('\n') }}"
        failed_details: "{{ (ssh_report_raw.stdout | regex_search('===LOG_DETAILS===\\n([\\s\\S]*)', '\\1')).split('\n') }}"

    - name: Display SSH Security Report
      ansible.builtin.debug:
        msg:
          - "===================================="
          - "SSH FAILED LOGIN REPORT"
          - "===================================="
          - "Hostname: {{ inventory_hostname }}"
          - "IP: {{ ansible_host | default(inventory_hostname) }}"
          - "Generated: {{ ansible_facts['date_time']['iso8601'] }}"
          - "Period: {{ ssh_log_period }}"
          - "Total Failed Login: {{ failed_count }}"
          - "Source IP Summary:"
          - "{{ ip_summary_lines }}"
          - "===================================="

    - name: Display Failed Login Details
      ansible.builtin.debug:
        var: failed_details
      when: failed_count | int > 0
