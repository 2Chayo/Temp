- name: SSH Failed Login Report across Servers
  hosts: all
  become: true
  gather_facts: true

  vars:
    ssh_log_period: "24 hours ago"
    ansible_python_interpreter: /usr/bin/python3

  tasks:

    - name: Get Failed Login Details safely
      ansible.builtin.shell: |
        journalctl --since "{{ ssh_log_period }}" --no-pager 2>/dev/null | grep "Failed password" || true
      args:
        executable: /bin/bash
      register: ssh_failed_raw
      changed_when: false

    - name: Count Failed Logins
      ansible.builtin.set_fact:
        failed_count: "{{ ssh_failed_raw.stdout_lines | reject('eq', '') | length }}"

    - name: Display Failed Login Details (if any)
      ansible.builtin.debug:
        var: ssh_failed_raw.stdout_lines
      when: failed_count | int > 0

    - name: Display No Failed Logins Message (if none)
      ansible.builtin.debug:
        msg: "No failed SSH logins found in the past 24 hours on {{ inventory_hostname }}"
      when: failed_count | int == 0
