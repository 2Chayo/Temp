---
- name: Report Today Failed SSH Logins (Last 100 lines)
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Fetch failed password attempts
      ansible.builtin.shell: >
        LC_ALL=C journalctl -u 'ssh*' --since "24 hours ago" --no-pager
        | grep "Failed password"
        | grep "sshd"
        | tail -n 100
      register: failed_ssh_logs
      changed_when: false
      failed_when: false

    - name: Display Failed Login Report
      ansible.builtin.debug:
        msg: "{{ failed_ssh_logs.stdout_lines }}"

    - name: Summary Top Attacking IPs
      ansible.builtin.shell: >
        LC_ALL=C journalctl -u 'ssh*' --since "24 hours ago" --no-pager
        | grep "Failed password"
        | grep "sshd"
        | grep -oE "from [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+"
        | awk '{print $2}'
        | sort | uniq -c | sort -nr | head -n 5
      register: top_ips
      changed_when: false
      failed_when: false

    - name: Display Top Attacking IPs
      ansible.builtin.debug:
        msg: "{{ top_ips.stdout_lines }}"
