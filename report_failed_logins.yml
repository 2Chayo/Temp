- name: SSH Failed Login Report
  hosts: all
  become: true
  gather_facts: true

  vars:
    ssh_log_period: "24 hours ago"
    ansible_python_interpreter: /usr/bin/python3

  tasks:

    - name: Collect SSH Failed Password Logs and Summarize IPs
      ansible.builtin.shell: |
        set -o pipefail
        journalctl -q \
          --since "{{ ssh_log_period }}" \
          --no-pager \
          -o short-iso 2>&1 \
          | grep -v "ansible-" \
          | awk '/(sshd|sshd-session)\[[0-9]+\]: Failed password for/'
      args:
        executable: /bin/bash
      register: ssh_failed_raw
      changed_when: false

    - name: Count Failed Logins
      ansible.builtin.set_fact:
        failed_count: "{{ ssh_failed_raw.stdout_lines | length }}"

    - name: Summarize Source IP
      ansible.builtin.shell: |
        if [ -n "{{ ssh_failed_raw.stdout }}" ]; then
          printf '%s\n' "{{ ssh_failed_raw.stdout }}" \
            | grep -oE 'from [0-9.]+' | awk '{print $2}' \
            | sort | uniq -c | sort -nr
        else
          echo "No failed logins"
        fi
      args:
        executable: /bin/bash
      register: ssh_ip_summary
      changed_when: false

    - name: Display SSH Security Report
      ansible.builtin.debug:
        msg:
          - "===================================="
          - "SSH FAILED LOGIN REPORT"
          - "===================================="
          - "Hostname: {{ inventory_hostname }}"
          - "IP: {{ ansible_host | default(inventory_hostname) }}"
          - "Generated: {{ ansible_facts['date_time']['iso8601'] }}"
          - "Period: {{ ssh_log_period }}"
          - "Total Failed Login: {{ failed_count }}"
          - "Source IP Summary:"
          - "{{ ssh_ip_summary.stdout_lines }}"
          - "===================================="

    - name: Display Failed Login Details
      ansible.builtin.debug:
        var: ssh_failed_raw.stdout_lines
      when: failed_count | int > 0
