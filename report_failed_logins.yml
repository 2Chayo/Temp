- name: SSH Failed Login Report
  hosts: all
  become: true
  gather_facts: true

  vars:
    ssh_log_period: "24 hours ago"
    ansible_python_interpreter: /usr/bin/python3

  tasks:

    - name: Collect SSH Failed Password Logs
      ansible.builtin.shell: |
        set -o pipefail
        journalctl -q \
          --since "{{ ssh_log_period }}" \
          --no-pager \
          -o short-iso 2>&1 \
          | grep -v "ansible-" \
          | awk '/(sshd|sshd-session)\[[0-9]+\]: Failed password for/'
      args:
        executable: /bin/bash
      register: ssh_failed_raw
      changed_when: false

    - name: Extract Source IPs and Count
      ansible.builtin.set_fact:
        failed_count: "{{ ssh_failed_raw.stdout_lines | length }}"
        # ดึง IP จากแต่ละบรรทัดมาเก็บเป็น List
        extracted_ips: "{{ ssh_failed_raw.stdout_lines | map('regex_search', 'from ([0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+)', '\\1') | flatten }}"

    - name: Summarize Source IP frequency
      ansible.builtin.set_fact:
        ip_summary_dict: "{{ extracted_ips | community.general.groupby('item') | ... }}" # ใช้ Group หรือประมวลผลผ่าน Jinja2
