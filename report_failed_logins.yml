- name: SSH Failed Login Report
  hosts: all
  become: true
  gather_facts: true

  vars:
    ssh_log_period: "24 hours ago"

  tasks:

    - name: Collect SSH Failed Password Logs
      ansible.builtin.shell: |
        set -o pipefail

        journalctl -q \
          --since "{{ ssh_log_period }}" \
          --no-pager \
          -o short-iso 2>&1 \
          | grep -v "ansible-" \
          | awk '/(sshd|sshd-session)\[[0-9]+\]: Failed password for/'
      args:
        executable: /bin/bash
      register: ssh_failed_raw
      changed_when: false

    - name: Count Failed Login
      ansible.builtin.set_fact:
        failed_count: "{{ ssh_failed_raw.stdout_lines | length }}"

    - name: Summarize Source IP
      ansible.builtin.shell: |
        printf '%s\n' {{ ssh_failed_raw.stdout | quote }} \
          | awk '{
              for (i=1; i<=NF; i++)
                if ($i == "from") print $(i+1)
            }' \
          | sort | uniq -c | sort -nr
      register: ssh_ip_summary
      changed_when: false

    - name: Display SSH Security Report
      ansible.builtin.debug:
        msg:
          - "===================================="
          - "SSH FAILED LOGIN REPORT"
          - "===================================="
          - "Hostname: {{ inventory_hostname }}"
          - "IP: {{ ansible_host | default(inventory_hostname) }}"
          - "Generated: {{ ansible_facts['date_time']['iso8601'] }}"
          - "Period: {{ ssh_log_period }}"
          - "Total Failed Login: {{ failed_count }}"
          - "Source IP Summary:"
          - "{{ ssh_ip_summary.stdout_lines }}"
          - "===================================="

    - name: Display Failed Login Details
      ansible.builtin.debug:
        var: ssh_failed_raw.stdout_lines
      when: failed_count | int > 0
