---
- name: Report Today Failed SSH Logins (Last 100 lines)
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Fetch failed password attempts from journalctl for today
      ansible.builtin.shell: |
        journalctl _COMM=sshd --since today --no-pager 2>/dev/null \
          | grep -iE "Failed|Invalid user|authentication failure" \
          | grep -v "ansible" \
          | tail -n 100
      register: failed_ssh_logs
      changed_when: false
      failed_when: false

    - name: Display Failed Login Report
      ansible.builtin.debug:
        msg: >-
          {{
            failed_ssh_logs.stdout_lines
            if (failed_ssh_logs.stdout_lines | length > 0)
            else ["Clean! No failed password attempts found today."]
          }}

    - name: Summary Top Attacking IPs Today
      ansible.builtin.shell: |
        journalctl _COMM=sshd --since today --no-pager 2>/dev/null \
          | grep -iE "Failed|Invalid user|authentication failure" \
          | grep -v "ansible" \
          | grep -oE "([0-9]{1,3}\.){3}[0-9]{1,3}" \
          | grep -v "127.0.0.1" \
          | sort | uniq -c | sort -nr | head -n 5
      register: top_ips
      changed_when: false
      failed_when: false

    - name: Display Top Attacking IPs
      ansible.builtin.debug:
        msg: >-
          {{
            top_ips.stdout_lines
            if (top_ips.stdout_lines | length > 0)
            else ["No attacks today"]
          }}
