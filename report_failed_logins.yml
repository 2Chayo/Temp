- name: SSH Failed Login Report
  hosts: all
  become: true
  gather_facts: true

  vars:
    ssh_log_period: "24 hours ago"
    ansible_python_interpreter: /usr/bin/python3

  tasks:

    - name: Collect SSH Failed Login Details
      ansible.builtin.shell: |
        set -o pipefail
        journalctl -q \
          --since "{{ ssh_log_period }}" \
          --no-pager \
          -o short-iso 2>&1 \
          | grep -vE "ansible-|sudo:" \
          | awk '/(sshd|sshd-session)\[[0-9]+\]: Failed password for/'
      args:
        executable: /bin/bash
      register: ssh_failed_raw
      changed_when: false

    - name: Count Failed Logins
      ansible.builtin.set_fact:
        failed_count: "{{ ssh_failed_raw.stdout_lines | length }}"

    - name: Display Failed Login Details
      ansible.builtin.debug:
        var: ssh_failed_raw.stdout_lines
      when: failed_count | int > 0
