
---
- name: Diagnose SSH Failed Login
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Check current server time
      ansible.builtin.command: date
      register: server_time
      changed_when: false

    - name: Check journal access
      ansible.builtin.command: journalctl --list-boots
      register: journal_boots
      changed_when: false

    - name: Search SSH logs on November 8
      ansible.builtin.shell: |
        LC_ALL=C journalctl -u 'ssh*' \
          --since "2026-11-08 00:00:00" \
          --until "2026-11-09 00:00:00" \
          --no-pager
      register: ssh_test
      changed_when: false

    - name: Display diagnostic result
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Server Time: {{ server_time.stdout }}"
          - "Journal Boots: {{ journal_boots.stdout_lines }}"
          - "Journal Exit Code: {{ ssh_test.rc }}"
          - "Matching Failed Login:"
          - "{{ ssh_test.stdout_lines | select('search', 'Failed password') | list }}"
          - "Total: {{ ssh_test.stdout_lines | select('search', 'Failed password') | list | length }}"
          - "Journal Error: {{ ssh_test.stderr }}"
