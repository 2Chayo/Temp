- name: SSH Failed Login Report
  hosts: all
  become: true
  gather_facts: true

  vars:
    ssh_log_period: "24 hours ago"
    ansible_python_interpreter: /usr/bin/python3

  tasks:

    - name: Get Failed Login Details
      ansible.builtin.shell: |
        set -o pipefail
        journalctl -u ssh --since "{{ ssh_log_period }}" --no-pager 2>/dev/null | grep "Failed password" || true
      args:
        executable: /bin/bash
      register: ssh_failed_raw
      changed_when: false

    - name: Get Summary IP Count
      ansible.builtin.shell: |
        set -o pipefail
        journalctl -u ssh --since "{{ ssh_log_period }}" --no-pager 2>/dev/null \
          | grep "Failed password" \
          | grep -oE 'from [0-9.]+' | awk '{print $2}' \
          | sort | uniq -c | sort -nr || true
      args:
        executable: /bin/bash
      register: ssh_ip_summary
      changed_when: false

    - name: Display SSH Failed Login Details
      ansible.builtin.debug:
        var: ssh_failed_raw.stdout_lines

    - name: Display IP Summary Report
      ansible.builtin.debug:
        var: ssh_ip_summary.stdout_lines
