---
- name: Configure DNS and Upgrade Packages
  hosts: all
  become: true  # เทียบเท่าการใช้ sudo (ต้องมีสิทธิ์ sudo บนเครื่องปลายทาง)
  gather_facts: false

  tasks:
    - name: Run apt update and dist-upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 0

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot the server if required
      ansible.builtin.reboot:
        msg: "Rebooting machine because system updates require it"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when: reboot_required.stat.exists
