---
- name: Upgrade packages and reboot if required
  hosts: all
  become: true
  gather_facts: false          # เปิดเป็น true ก็ต่อเมื่อมี task ที่ใช้ ansible_facts
  serial: "{{ serial_batch | default(1) }}"   # ทีละกี่เครื่อง (override ได้ใน Extra vars)

  vars:
    auto_reboot: true          # false = อัปเกรดอย่างเดียว ไม่ reboot

  environment:
    DEBIAN_FRONTEND: noninteractive

  tasks:
    - name: Run apt update and dist-upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        lock_timeout: 120                        # รอ apt lock แทนที่จะ fail ทันที
        dpkg_options: "force-confdef,force-confold"  # กัน prompt ถามเรื่อง config ค้าง
      register: apt_output

    - name: Show apt output
      ansible.builtin.debug:
        msg: "{{ apt_output.stdout_lines | default([]) }}"
      when: apt_output.changed

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot the server if required
      ansible.builtin.reboot:
        msg: "Rebooting machine because system updates require it"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when:
        - auto_reboot | bool
        - reboot_required.stat.exists
