- name: Configure DNS and Upgrade Packages
  hosts: all
  become: yes
  become_method: sudo
  become_user: root
  gather_facts: true

  tasks:
    - name: Run apt update and dist-upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 0
      register: apt_output  # 1. บันทึกผลลัพธ์ของ apt เก็บไว้ในตัวแปรนี้

    - name: Show upgraded packages
      ansible.builtin.debug:
        msg: "{{ apt_output.stdout_lines }}"  # 2. สั่งแสดงผลรายชื่อที่อัปเกรดออกหน้าจอ Log
      when: apt_output.changed  # จะแสดงผลเฉพาะเครื่องที่มีการเปลี่ยนแปลงจริง

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot the server if required
      ansible.builtin.reboot:
        msg: "Rebooting machine because system updates require it"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when: reboot_required.stat.exists
